spring:
  datasource:
    url: jdbc:postgresql://192.168.7.104:5433/despatch-tracker?currentSchema=despatch
    username: claimbook
    password: Claimbook
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DevHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        enable_lazy_load_no_trans: false

logging:
  level:
    root: INFO
    com.abi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
